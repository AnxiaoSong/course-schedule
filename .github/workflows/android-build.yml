name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets
        run: |
          set -o pipefail
          node node_modules/@capacitor/cli/bin/capacitor sync android 2>&1 | tee sync.log

      - name: Report sync failure
        if: failure()
        run: |
          if [ -f sync.log ]; then
            sed 's/\x1b\[[0-9;]*m//g' sync.log | head -8 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit 0

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-error.log

      - name: Report failure details
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' android/build-error.log | grep -E "FAILURE:|What went wrong|Caused by|Could not|Failed to|error:|SDK location|Unsupported|Minimum required" | head -8 | while IFS= read -r line; do echo "::error::$line"; done
          exit 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: course-schedule-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
