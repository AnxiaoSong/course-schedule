<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>签到投影</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #0f1428; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 30px; gap: 24px;
    }
    h1 { margin: 0; font-size: 34px; letter-spacing: 2px; }
    .sub { color: #8a93a3; font-size: 16px; margin: -8px 0 0; }
    .card {
      background: #fff; border-radius: 20px; padding: 26px 34px 20px;
      text-align: center; color: #1f2430;
    }
    .qr svg { width: min(46vh, 340px); height: min(46vh, 340px); display: block; }
    .cap { font-size: 22px; font-weight: 800; margin-top: 12px; }
    .note { font-size: 14px; color: #5b6473; margin-top: 6px; font-family: ui-monospace, Consolas, monospace; }
    .hint { color: #5b6473; font-size: 14px; text-align: center; line-height: 2; }
    .hint b { color: #4ade80; }
  </style>
</head>
<body>
  <h1>课堂签到</h1>
  <p class="sub">用手机流量扫码签到（无需连接任何 WiFi）</p>
  <div class="card">
    <div class="qr" id="signQr"></div>
    <div class="cap">扫码签到</div>
    <div class="note" id="signNote"></div>
  </div>
  <p class="hint">无法扫码？用浏览器直接访问：<b id="urlText"></b><br>填写学号与姓名，点击签到即可</p>

  <script src="/lib/qrcode.js"></script>
  <script src="/lib/qrcode_UTF8.js"></script>
  <script>
    "use strict";
    function qrSvg(text, size) {
      var qr = qrcode(0, "M");
      qr.addData(text);
      qr.make();
      return qr.createSvgTag({ cellSize: size, margin: 2 });
    }

    var FALLBACK_URL = "https://ai-song.online/";

    function joinUrl(base) {
      return String(base || "").replace(/\/+$/, "") + "/student";
    }

    function renderBase(base) {
      var url = joinUrl(base);
      document.getElementById("signQr").innerHTML = qrSvg(url, 8);
      document.getElementById("signNote").textContent = url;
      document.getElementById("urlText").textContent = url;
    }

    fetch("/api/info").then(function (r) { return r.json(); }).then(function (info) {
      var ips = info.ips || [];
      var ip = ips[0] || "localhost";
      renderBase(info.publicUrl || ("http://" + ip + ":" + info.port));
    }).catch(function () {
      // 独立模式（GitHub Pages）：固定指向云域名
      renderBase(FALLBACK_URL);
    });
  </script>
</body>
</html>
