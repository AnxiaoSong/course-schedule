<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>蓝牙签到 · 学生端</title>
  <style>
    :root { --brand: #3b5bdb; --brand-soft: #eef2ff; --ink: #1f2430; --muted: #8a93a3; --line: #e6e9ef; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; background: #f2f4f8; color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      width: 100%; max-width: 400px; background: #fff; border-radius: 18px;
      box-shadow: 0 10px 30px rgba(28, 39, 71, .10); padding: 26px 22px; text-align: center;
    }
    h1 { margin: 0 0 6px; font-size: 20px; }
    .sub { margin: 0 0 20px; font-size: 12px; color: var(--muted); }
    input {
      width: 100%; border: 1.5px solid var(--line); border-radius: 12px;
      padding: 13px 14px; font-size: 16px; outline: none; text-align: center;
      font-family: inherit;
    }
    input:focus { border-color: var(--brand); }
    input::placeholder { color: #b9c0cc; }
    button {
      width: 100%; margin-top: 14px; border: 0; border-radius: 12px; padding: 14px 0;
      background: linear-gradient(135deg, #3b5bdb, #7c5cfa); color: #fff;
      font-size: 16px; font-weight: 700; letter-spacing: 2px; font-family: inherit; cursor: pointer;
      box-shadow: 0 8px 20px rgba(59, 91, 219, .35);
    }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .5; box-shadow: none; }
    .msg { margin-top: 16px; font-size: 13px; min-height: 20px; color: var(--muted); }
    .msg.ok { color: #12b76a; font-weight: 700; }
    .msg.err { color: #e5484d; }
    .steps { margin-top: 18px; text-align: left; font-size: 12px; color: var(--muted); line-height: 1.9; }
    .ok-big { display: none; margin: 10px 0; font-size: 52px; }
    .done .ok-big { display: block; animation: pop .3s ease; }
    @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="ok-big">✅</div>
    <h1>蓝牙签到</h1>
    <p class="sub">连接老师的蓝牙设备后自动签到</p>
    <input id="name" type="text" maxlength="20" placeholder="输入姓名" autocomplete="off" />
    <button id="go" type="button">连接并签到</button>
    <div class="msg" id="msg"></div>
    <div class="steps">
      使用步骤：① 打开手机蓝牙与位置信息 ② 输入姓名（下次自动记住）③ 点击按钮 → 在弹出列表中选择老师设备 → 自动完成签到<br />
      支持安卓 Chrome / Edge 浏览器（iOS 不支持）
    </div>
  </div>

  <script>
    "use strict";
    var SERVICE = "5f6d7a81-9b3c-4d2e-8a1f-0c5b4e3d2f10";
    var CHAR = "5f6d7a82-9b3c-4d2e-8a1f-0c5b4e3d2f10";
    var nameEl = document.getElementById("name");
    var goEl = document.getElementById("go");
    var msgEl = document.getElementById("msg");
    var cardEl = document.getElementById("card");

    nameEl.value = localStorage.getItem("ci-student-name") || "";

    function say(text, cls) {
      msgEl.textContent = text;
      msgEl.className = "msg" + (cls ? " " + cls : "");
    }

    if (!navigator.bluetooth) {
      say("当前浏览器不支持 Web 蓝牙，请用安卓 Chrome 打开本页", "err");
      goEl.disabled = true;
    }

    goEl.addEventListener("click", async function () {
      var name = nameEl.value.trim();
      if (!name) { say("请先输入姓名", "err"); nameEl.focus(); return; }
      localStorage.setItem("ci-student-name", name);
      goEl.disabled = true;
      cardEl.classList.remove("done");
      try {
        say("请在弹窗中选择老师的蓝牙设备…");
        var device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [SERVICE] }],
          optionalServices: [SERVICE]
        });
        say("正在连接 " + (device.name || "老师设备") + " …");
        var server = await device.gatt.connect();
        var service = await server.getPrimaryService(SERVICE);
        var characteristic = await service.getCharacteristic(CHAR);
        say("正在签到…");
        var data = new TextEncoder().encode(name);
        await characteristic.writeValue(data);
        server.disconnect();
        cardEl.classList.add("done");
        say("签到成功：" + name, "ok");
        if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
      } catch (err) {
        var m = err && err.message ? err.message : String(err);
        if (/cancel|User cancelled|NotFound/i.test(m)) say("已取消，未完成签到", "err");
        else say("签到失败：" + m + "，请靠近老师后重试", "err");
      } finally {
        goEl.disabled = false;
      }
    });
  </script>
</body>
</html>
